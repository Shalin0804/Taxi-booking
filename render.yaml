# Render Blueprint for the API. In Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: tttcabs-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false          # paste the TiDB Cloud connection string
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false          # your Vercel URL, e.g. https://taxi-booking.vercel.app
